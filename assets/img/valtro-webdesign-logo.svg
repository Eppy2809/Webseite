<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Valtro Webdesign logo</title>
  <desc id="desc">Valtro Webdesign wordmark with an interlocking V and W monogram in website colors.</desc>
  <defs>
    <linearGradient id="petrol" x1="110" y1="54" x2="420" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75CEC7"/><stop offset="1" stop-color="#3E9794"/>
    </linearGradient>
    <linearGradient id="olive" x1="270" y1="54" x2="440" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8B89C"/><stop offset="1" stop-color="#7E9B88"/>
    </linearGradient>
    <linearGradient id="gold" x1="375" y1="54" x2="945" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6C36F"/><stop offset=".5" stop-color="#D3A650"/><stop offset="1" stop-color="#B58237"/>
    </linearGradient>
  </defs>
  <!-- Interlocking V/W monogram: strong diagonal rails, modelled after the Valtro Pay visual language. -->
  <path d="M82 56h110l171 315-55 102L82 56Z" fill="url(#petrol)"/>
  <path d="M344 56h108L308 473H198L344 56Z" fill="url(#olive)"/>
  <path d="M375 56h108l91 224 76-164h92l76 164 90-224h108L891 390H782l-86-180-86 180H500L375 56Z" fill="url(#gold)"/>
  <path d="M330 219h72l-36 61-36-61Z" fill="#0A1010"/>
  <path d="M352 234h28l-14 24-14-24Z" fill="#DAB05B"/>
  <text x="156" y="503" fill="#F3F5F3" font-family="Inter, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="-5">Valtro</text>
  <text x="731" y="503" fill="#B7C1BE" font-family="Inter, Arial, sans-serif" font-size="98" font-weight="400" letter-spacing="-4">–Webdesign</text>
</svg>
